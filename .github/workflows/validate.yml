name: Validate episode data
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the pilot
        run: python scripts/validate_episode.py episodes/001-pilot.json
      - name: Test camera trajectory
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Export sample camera CSV
        run: python scripts/build_camera_path.py --output output/camera.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-camera-timeline
          path: output/camera.csv
